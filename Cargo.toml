[package]
name = "rand_explorer"
version = "0.1.0"
edition = "2024"

[dependencies]
eframe = { version = "0.37", default-features = false, features = ["glow", "default_fonts", "clipboard"] }
egui = "0.37"
egui_plot = "0.38"
plotly = "0.14"
rand = "0.10"
rand_core = "0.10"
rand_distr = "0.6"
rand_chacha = "0.10"
rand_pcg = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
vergen-gitcl = { version = "10", features = ["build", "cargo", "rustc", "si"] }
